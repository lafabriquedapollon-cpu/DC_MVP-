name: J5-02C WebAuthn approval lab (NOT A RELEASE)
on:
  push:
    branches: [ci/j5-02c-passkey-lab-20261127]
permissions:
  contents: read
jobs:
  synthetic-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project WebAuthn pins
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'webauthn==3.0.0' 'cryptography==49.0.0'
          python -m pip check
      - name: Synthetic signature and persisted replay checks
        run: python -B -m scripts.ci_j5_02c_passkey_lab
