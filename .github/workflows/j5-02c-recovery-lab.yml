name: J5-02C.3 recovery and anti-replay synthetic LAB
on:
  push:
    branches: [ci/j5-02c-recovery-antireplay-20261127]
permissions:
  contents: read
jobs:
  recovery-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project pins
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'webauthn==3.0.0' 'cryptography==49.0.0'
          python -m pip check
      - name: Verify exact checkout and isolated diff
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only 408f687eabc1550867b37cd18eef5a9295895745 HEAD | sort | paste -sd ' ' -)" = '.github/workflows/j5-02c-recovery-lab.yml scripts/ci_j5_02c_recovery_lab.py'
      - name: Actual SQLite and cryptographic negative tests
        run: python -B -m scripts.ci_j5_02c_recovery_lab
