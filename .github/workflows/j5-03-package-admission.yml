name: J5-03 package input admission (NOT A RELEASE)
on:
  push:
    branches: [ci/j5-03-package-admission-20261127]
permissions:
  contents: read
jobs:
  input-admission:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify exact HEAD and preserved guards
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only 7cf1668b3145ac8e2c78b3ad5844f16a3adc8554 HEAD | sort | paste -sd ' ' -)" = '.github/workflows/j5-03-package-admission.yml docs/J5-03-PACKAGE-ADMISSION.md scripts/ci_j5_03_package_admission.py'
      - name: Read-only dependency, asset and certification admission
        run: python -B -m scripts.ci_j5_03_package_admission
