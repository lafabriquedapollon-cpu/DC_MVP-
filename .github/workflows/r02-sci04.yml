name: R0.2 SCI-04 provenance
on:
  push:
    branches: [ci/r02-sci04-06-20261126]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned isolated HTTP test dependencies
        run: python -m pip install pydantic==2.6.3 pydantic-settings==2.2.1 SQLAlchemy==2.0.28 fastapi==0.115.6 starlette==0.41.3 httpx==0.28.1 python-dotenv==1.2.1 python-jose==3.5.0 passlib==1.7.4 email-validator==2.3.0 python-multipart==0.0.31
      - name: Install exact frontend lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'HEAD_MISMATCH' }
          python -I -B scripts/ci_r02_sci02.py
          if ($LASTEXITCODE -ne 0) { throw 'SCI02_FAILED' }
          python -I -B scripts/ci_r02_sci04.py
          if ($LASTEXITCODE -ne 0) { throw 'SCI04_FAILED' }
          node --experimental-strip-types --test scripts/ci_r02_sci03.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'SCI03_FAILED' }
          $fixture = Join-Path $env:RUNNER_TEMP 'sci05-response.json'
          try {
            python -I -B scripts/ci_r02_sci05_http.py $fixture
            if ($LASTEXITCODE -ne 0) { throw 'SCI05_HTTP_FAILED' }
            node --experimental-strip-types --test scripts/ci_r02_sci05_wire.test.mts
            if ($LASTEXITCODE -ne 0) { throw 'SCI05_WIRE_FAILED' }
            $tools = Join-Path $env:RUNNER_TEMP ('sci05-tools-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $tools | Out-Null
            try {
              '{"private":true}' | Set-Content -LiteralPath (Join-Path $tools 'package.json') -Encoding ascii
              npm install --prefix $tools --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.61.0
              if ($LASTEXITCODE -ne 0) { throw 'SCI05_PLAYWRIGHT_INSTALL_FAILED' }
              $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $tools 'browsers'
              node (Join-Path $tools 'node_modules/playwright-core/cli.js') install chromium
              if ($LASTEXITCODE -ne 0) { throw 'SCI05_CHROMIUM_INSTALL_FAILED' }
              $env:SCI05_TOOLS = $tools
              node frontend/scripts/ci-r02-sci05-browser.mjs
              if ($LASTEXITCODE -ne 0) { throw 'SCI05_BROWSER_FAILED' }
            } finally { if (Test-Path -LiteralPath $tools) { Remove-Item -LiteralPath $tools -Recurse -Force } }
          } finally {
            if (Test-Path $fixture) { Remove-Item -LiteralPath $fixture }
          }
      - name: Retain synthetic browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: sci05-synthetic-browser-evidence
          path: ${{ runner.temp }}/sci05-browser-evidence/
          if-no-files-found: error
          retention-days: 7
