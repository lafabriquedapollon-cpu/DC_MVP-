          ns="dc-build-$GITHUB_RUN_ID"
          lab=$(mktemp -d "$RUNNER_TEMP/dc-build.XXXXXXXX")
          trap 'sudo ip netns del "$ns" 2>/dev/null || true; rm -rf -- "$lab"' EXIT
