      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc-desktop-integration-synthetic
          path: ${{ runner.temp }}/dc-integration-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
  r02-desktop-final-full-runtime-dependencies:
    needs: inventory
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact convergence HEAD
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'HEAD_MISMATCH' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Build guarded same-origin synthetic frontend
        working-directory: frontend
        shell: pwsh
        env:
          VITE_API_URL: http://127.0.0.1:8008
          VITE_ENABLE_HTTPS: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('.env','.env.local','.env.production','.env.production.local')) {
            if (Test-Path -LiteralPath $file) { throw 'PRIVATE_FRONTEND_ENV_REFUSED' }
          }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'FRONTEND_DEPS_FAILED' }
          npm run build:rehearsal
          if ($LASTEXITCODE -ne 0) { throw 'FRONTEND_BUILD_FAILED' }
          node scripts/ci-pwa-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PWA_ASSET_CONTRACT_FAILED' }
          node --check scripts/ci-desktop-integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_DRIVER_SYNTAX_FAILED' }
      - name: Install isolated Playwright Chromium test tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP ("dc-browser-tools-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $tools | Out-Null
          '{"private":true,"name":"dc-browser-ci","version":"0.0.0"}' | Set-Content -LiteralPath (Join-Path $tools 'package.json') -Encoding ascii
          npm install --prefix $tools --ignore-scripts --no-audit --no-fund --save-exact --registry https://registry.npmjs.org playwright-core@1.61.0
          if ($LASTEXITCODE -ne 0) { throw 'PLAYWRIGHT_TOOL_INSTALL_FAILED' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $tools 'browsers'
          node (Join-Path $tools 'node_modules\playwright-core\cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'PLAYWRIGHT_CHROMIUM_INSTALL_FAILED' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("DC_BROWSER_TOOLS=" + $tools) -Encoding utf8
          node --check frontend/scripts/ci-r02-windows-browser.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PIPE_CONTROLLER_SYNTAX_FAILED' }
          Write-Host 'R02_DESKTOP_PLAYWRIGHT_TOOLING_PASS'
      - name: Provision native MinGW64 libraries on disposable GitHub runner
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'MSYS2_RUNNER_MISSING' }
          $env:MSYSTEM = 'MINGW64'
          $env:CHERE_INVOKING = '1'
          # Do not disable package signatures or use Git's MSYS runtime DLLs.
          & $bash -lc 'set -e; pacman-conf SigLevel; pacman -Syu --noconfirm'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2_UPDATE_FAILED' }
          & $bash -lc 'set -e; pacman -Syu --noconfirm; pacman -S --needed --noconfirm mingw-w64-x86_64-file mingw-w64-x86_64-pango; pacman -Q mingw-w64-x86_64-file mingw-w64-x86_64-pango; pacman -Qo /mingw64/bin/libmagic-1.dll /mingw64/bin/libpango-1.0-0.dll /mingw64/bin/libgobject-2.0-0.dll /mingw64/bin/libpangoft2-1.0-0.dll /mingw64/share/misc/magic.mgc'
          if ($LASTEXITCODE -ne 0) { throw 'MINGW_NATIVE_PROVISION_FAILED' }
          foreach ($dll in @('libmagic-1.dll','libpango-1.0-0.dll','libgobject-2.0-0.dll','libpangoft2-1.0-0.dll')) {
            $file = Join-Path 'C:\msys64\mingw64\bin' $dll
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "NATIVE_DLL_MISSING $dll" }
            Write-Host ('R02_NATIVE_DLL_SHA256 ' + $dll + '=' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())
          }
          Write-Host 'R02_MINGW_NATIVE_PROVISION_PASS'
      - name: Rebuild required inputs and verify remaining integrated desktop closeout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lab = Join-Path $env:RUNNER_TEMP ('dc-full-deps-' + [guid]::NewGuid().ToString('N'))
          try {
            python -m venv $lab
            if ($LASTEXITCODE -ne 0) { throw 'VENV_FAILED' }
            $py = Join-Path $lab 'Scripts\python.exe'
            & $py -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0' 'torchvision==0.25.0' 'torchaudio==2.10.0'
            if ($LASTEXITCODE -ne 0) { throw 'CPU_WHEEL_INSTALL_FAILED' }
            # Build only explicitly reviewed, hash-pinned source-only distributions.
            & $py -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple 'setuptools==82.0.0' 'wheel==0.46.3'
            if ($LASTEXITCODE -ne 0) { throw 'PINNED_WHEEL_BUILDER_INSTALL_FAILED' }
            $wheelhouse = Join-Path $lab 'verified-wheelhouse'
            New-Item -ItemType Directory -Path $wheelhouse | Out-Null
            $approved = @(
              @{ project='svglib'; version='1.5.1'; file='svglib-1.5.1.tar.gz'; sha='3ae765d3a9409ee60c0fb4d24c2deb6a80617aa927054f5bcd7fc98f0695e587'; wheelPattern='^svglib-1\.5\.1-py3-none-any\.whl$' },
              @{ project='http-ece'; version='1.2.1'; file='http_ece-1.2.1.tar.gz'; sha='8c6ab23116bbf6affda894acfd5f2ca0fb8facbcbb72121c11c75c33e7ce8cff'; wheelPattern='^http_ece-1\.2\.1-(py3|py2\.py3)-none-any\.whl$' }
            )
            $constraints = Join-Path $lab 'reviewed-source-constraints.txt'
            foreach ($entry in $approved) {
              $sdist = Join-Path $lab $entry.file
              $release = Invoke-RestMethod -Uri ("https://pypi.org/pypi/{0}/{1}/json" -f $entry.project,$entry.version)
              $source = @($release.urls | Where-Object { $_.filename -ceq $entry.file -and $_.packagetype -ceq 'sdist' })
              if ($source.Count -ne 1 -or $source[0].digests.sha256 -cne $entry.sha -or $source[0].yanked) { throw ("SOURCE_IDENTITY_MISMATCH " + $entry.project) }
              $uri = [uri]$source[0].url
              if ($uri.Scheme -cne 'https' -or $uri.Host -cne 'files.pythonhosted.org' -or $uri.UserInfo) { throw 'SOURCE_ORIGIN_REFUSED' }
              Invoke-WebRequest -Uri $uri -OutFile $sdist
              if ((Get-FileHash -LiteralPath $sdist -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha) { throw ("SOURCE_HASH_MISMATCH " + $entry.project) }
              Write-Host ("R02_REVIEWED_SOURCE_SHA256_PASS " + $entry.project)
              & $py -m pip --isolated wheel --disable-pip-version-check --no-cache-dir --no-index --no-deps --no-build-isolation --wheel-dir $wheelhouse $sdist
              if ($LASTEXITCODE -ne 0) { throw ("LOCAL_WHEEL_BUILD_FAILED " + $entry.project) }
              $wheels = @(Get-ChildItem -LiteralPath $wheelhouse -File | Where-Object { $_.Name -cmatch $entry.wheelPattern })
              if ($wheels.Count -ne 1) { throw ("WHEEL_IDENTITY_MISMATCH " + $entry.project) }
              Write-Host ("R02_REVIEWED_LOCAL_WHEEL_SHA256 " + $entry.project + "=" + (Get-FileHash -LiteralPath $wheels[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())
              Add-Content -LiteralPath $constraints -Value ($entry.project + '==' + $entry.version) -Encoding ascii
            }
            if (@(Get-ChildItem -LiteralPath $wheelhouse -File).Count -ne $approved.Count) { throw 'UNEXPECTED_WHEELHOUSE_CONTENT' }
            # Resolve the entire dependency graph before mutating the full environment.
            # No generic source fallback, including transitive packages.
            $report = Join-Path $lab 'wheel-resolution.json'
            $requirements = Join-Path $env:GITHUB_WORKSPACE 'backend\requirements-windows-build.txt'
            $resolver = @('--disable-pip-version-check','--no-cache-dir','--only-binary=:all:','--index-url','https://pypi.org/simple','--find-links',$wheelhouse,'-c',$constraints,'-r',$requirements)
            & $py -m pip --isolated install @resolver --dry-run --report $report
            if ($LASTEXITCODE -ne 0) { throw 'FULL_WINDOWS_BINARY_GRAPH_RESOLUTION_FAILED' }
            $plan = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            foreach ($item in $plan.install) {
              $url = [uri]$item.download_info.url
              if (-not $url.AbsolutePath.EndsWith('.whl',[StringComparison]::OrdinalIgnoreCase)) { throw 'NON_WHEEL_IN_RESOLUTION' }
              if ($url.Scheme -eq 'file') {
                if ((Split-Path -Parent $url.LocalPath) -ne $wheelhouse) { throw 'UNAPPROVED_LOCAL_WHEEL' }
              } elseif ($url.Scheme -cne 'https' -or $url.Host -cne 'files.pythonhosted.org') {
                throw 'UNAPPROVED_RESOLVER_ORIGIN'
              }
              # Constrain resolved versions so actual installation cannot silently re-resolve.
              if ($item.metadata.name -notmatch '^[A-Za-z0-9_.-]+$' -or $item.metadata.version -notmatch '^[A-Za-z0-9.+!_-]+$') { throw 'INVALID_RESOLVER_METADATA' }
              Add-Content -LiteralPath $constraints -Value ($item.metadata.name + '==' + $item.metadata.version) -Encoding ascii
            }
            Write-Host ("R02_FULL_WINDOWS_BINARY_GRAPH_RESOLUTION_PASS count=" + @($plan.install).Count)
            & $py -m pip --isolated install @resolver
            if ($LASTEXITCODE -ne 0) { throw 'FULL_WINDOWS_WHEEL_INSTALL_FAILED' }
            & $py -m pip check
            if ($LASTEXITCODE -ne 0) { throw 'DEPENDENCY_CONSISTENCY_FAILED' }
            $env:HOME = $lab
            $env:USERPROFILE = $lab
            $env:APPDATA = $lab
            $env:LOCALAPPDATA = $lab
            $env:DC_NATIVE_MINGW_BIN = 'C:\msys64\mingw64\bin'
            $env:HF_HUB_OFFLINE = '1'
            $env:TRANSFORMERS_OFFLINE = '1'
            $env:PYTHONDONTWRITEBYTECODE = '1'
            # Capitalize the previous independent qualification; fail on version drift.
            & $py -I (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci_r02_desktop_proven_versions.py')
            if ($LASTEXITCODE -ne 0) { throw 'DEPENDENCY_REQUALIFICATION_REQUIRED' }
            # Reconstruct the sidecar using the existing exact native hash lock.
            & $py -I (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci_r02_stage_native_bundle.py')
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_BUNDLE_CLOSURE_FAILED' }
            # No separate native bundle, storage or preflight reruns.
            & $py -I (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci_r02_backend_rehearsal_harness.py') --desktop-final-only
            if ($LASTEXITCODE -ne 0) { throw 'BACKEND_FROZEN_REHEARSAL_FAILED' }
          } finally {
            if (Test-Path -LiteralPath $lab) { Remove-Item -LiteralPath $lab -Recurse -Force }
          }
          if (Test-Path -LiteralPath $lab) { throw 'FULL_WINDOWS_LAB_CLEANUP_FAILED' }
          Write-Host 'R02_FULL_WINDOWS_DEPENDENCY_REHEARSAL_CLEANUP_PASS'
      - name: Upload synthetic desktop screenshots only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r02-packaged-desktop-synthetic-evidence
          path: |
            ${{ runner.temp }}\dc-packaged-desktop-evidence\*.png
            ${{ runner.temp }}\dc-packaged-desktop-evidence\head.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remove isolated browser tooling
        if: always()
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP ("dc-browser-tools-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $tools) { Remove-Item -LiteralPath $tools -Recurse -Force }
          if (Test-Path -LiteralPath $tools) { throw 'BROWSER_TOOL_CLEANUP_FAILED' }
  r01-fue-team-ui-desktop-integration:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact convergence HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate integration driver syntax
        run: node --check frontend/scripts/ci-fue-team-ui.mjs
      - name: Validate all Python source syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('backend').rglob('*.py'))
          for p in files:
              ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          print(f'BACKEND_AST_PASS files={len(files)}')
          PY
      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlcipher-dev libmagic1 libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libgl1 libglib2.0-0t64
      - name: Install pinned Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0' 'torchvision==0.25.0' 'torchaudio==2.10.0'
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple -r backend/requirements.txt
          python -m pip check
          echo PYTHON_DEPENDENCIES_PASS
      - name: Create fresh encrypted LAB and run actual FastAPI without external network
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lab=$(mktemp -d "$RUNNER_TEMP/dc-rehearsal.XXXXXXXX")
          ns="dc-rehearsal-$GITHUB_RUN_ID"
          trap 'sudo ip netns del "$ns" 2>/dev/null || true; rm -rf -- "$lab"' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up
          export DC_LAB_ROOT="$lab"
          export DC_PYTHON="$(command -v python)"
          export DC_CHECKOUT="$GITHUB_WORKSPACE"
          export DC_EVIDENCE="$RUNNER_TEMP/dc-integration-evidence"
          mkdir -p "$DC_EVIDENCE"
          sudo ip netns exec "$ns" runuser -u "$USER" -- env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" DC_LAB_ROOT="$lab" DC_PYTHON="$DC_PYTHON" DC_CHECKOUT="$DC_CHECKOUT" DC_EVIDENCE="$DC_EVIDENCE" bash -s <<'LAB'
          set -euo pipefail
          umask 077
          cd "$DC_CHECKOUT"
          export HOME="$DC_LAB_ROOT/home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_RUNTIME_DIR="$HOME/runtime" XDG_DATA_HOME="$HOME/data"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME" "$DC_LAB_ROOT/rehearsal-media"
          export ENVIRONMENT=e2e_install_rehearsal
          export ALLOWED_ORIGINS=http://127.0.0.1:5173
          export DC_SYNTH_PASSWORD="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export VITE_API_URL=http://127.0.0.1:8008 VITE_ENABLE_HTTPS=false
          export DATABASE_URL="sqlite:///$DC_LAB_ROOT/fresh-rehearsal.db"
          export MEDIA_ROOT="$DC_LAB_ROOT/rehearsal-media"
          export SECRET_KEY="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export CABINET_MASTER_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export SQLCIPHER_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export MOBILE_PAIRING_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export DIGITALCROWN_ISOLATED_RUNTIME=true TELEMETRY_ENABLED=false
          export GOOGLE_CLIENT_ID='' GOOGLE_CLIENT_SECRET='' SMTP_HOST='' PATIENT_COMPANION_RELAY_URL='' PATIENT_COMPANION_RELAY_BOOTSTRAP_SECRET=''
          export DIGITALCROWN_ISOLATION_DB_FINGERPRINT="$("$DC_PYTHON" -c 'import os; from backend.core.runtime_safety import database_target_fingerprint; print(database_target_fingerprint(os.environ["DATABASE_URL"]))')"
          test ! -e "$DC_LAB_ROOT/fresh-rehearsal.db"
          test "$(ip -o link show | wc -l)" -eq 1
          echo LAB_LOOPBACK_ONLY
          "$DC_PYTHON" -m backend.scripts.ci_fresh_backend_rehearsal
          "$DC_PYTHON" -m backend.scripts.ci_fk_runtime_probe
          "$DC_PYTHON" -m backend.scripts.ci_desktop_integration seed
          "$DC_PYTHON" -m uvicorn backend.main:app --host 127.0.0.1 --port 8008 > "$DC_LAB_ROOT/uvicorn.log" 2>&1 &
          pid=$!
          trap 'rc=$?; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; if [ "$rc" -ne 0 ]; then tail -n 60 "$DC_LAB_ROOT/uvicorn.log" | sed -E "s/([[:xdigit:]]{64})/[MASKED]/g"; fi' EXIT
          "$DC_PYTHON" - <<'PY'
          import json, time, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def get(path):
              with opener.open('http://127.0.0.1:8008' + path, timeout=2) as r:
                  assert r.status == 200
                  return json.load(r)
          for attempt in range(60):
              try:
                  root = get('/health')
                  assert root['status'] == 'ok' and root['db'] == 'ok'
                  break
              except (OSError, AssertionError, ValueError, KeyError):
                  time.sleep(1)
          else:
              raise SystemExit('BACKEND_HEALTH_BLOCKED')
          result = get('/api/health')
          assert result['status'] == 'ok' and result['database'] == 'ok'
          assert result['environment'] == 'e2e_install_rehearsal'
          assert get('/api/health/db')['status'] == 'ok'
          assert get('/api/health/storage')['status'] == 'ok'
          print('BACKEND_HTTP_PASS: /health, /api/health, /api/health/db, /api/health/storage')
          PY
          (
            cd frontend
            exec ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort
          ) > "$DC_LAB_ROOT/vite.log" 2>&1 &
          vite_pid=$!
          chrome_pid=
          trap 'rc=$?; kill "$pid" "$vite_pid" ${chrome_pid:+"$chrome_pid"} 2>/dev/null || true; wait "$pid" "$vite_pid" ${chrome_pid:+"$chrome_pid"} 2>/dev/null || true; exit "$rc"' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --noproxy '*' --fail --silent http://127.0.0.1:5173/login >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-sync --disable-extensions --no-first-run --no-default-browser-check --window-size=1440,900 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir="$DC_LAB_ROOT/chrome" http://127.0.0.1:5173/login > "$DC_LAB_ROOT/chrome.log" 2>&1 &
          chrome_pid=$!
          timeout 300s node frontend/scripts/ci-fue-team-ui.mjs
          kill "$pid"
          wait "$pid" || true
          "$DC_PYTHON" -m backend.scripts.ci_desktop_integration verify
          "$DC_PYTHON" -m uvicorn backend.main:app --host 127.0.0.1 --port 8008 > "$DC_LAB_ROOT/uvicorn-restart.log" 2>&1 &
          pid=$!
          "$DC_PYTHON" - <<'PY'
          import json, time, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  with opener.open("http://127.0.0.1:8008/health", timeout=2) as r:
                      assert json.load(r)["db"] == "ok"
                  break
              except (OSError, AssertionError, ValueError, KeyError):
                  time.sleep(1)
          else:
              raise RuntimeError("Restart health failed")
          PY
          timeout 150s node frontend/scripts/ci-fue-team-ui.mjs --verify-restart
          LAB
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dc-fue-team-archive-ui-synthetic
          path: ${{ runner.temp }}/dc-integration-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
  r02-sci04-synthetic:
    needs: inventory
