name: Phase 2 convergence - synthetic LAB only
on:
  push:
    branches: [ci/phase2-convergence-20261127]
    paths: ['.github/workflows/phase2-convergence.yml']
permissions:
  contents: read
concurrency:
  group: phase2-convergence
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact orchestration HEAD and candidate delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0a99bbcc27d5be27ea3b87d3431fde2c78bc7c6b"
          test "$(git diff --name-status HEAD^ HEAD)" = "$(printf 'A\t.github/workflows/phase2-convergence.yml')"
          test ! -e .github/workflows/cabinet-release-certification.yml
          python - <<'PY'
          import subprocess, re, collections, pathlib
          base = 'f7fa10e12e4db0f4ab23961d82a6050e46b2a8f8'
          candidate = '0a99bbcc27d5be27ea3b87d3431fde2c78bc7c6b'
          def git(*args):
              return subprocess.check_output(['git', *args])
          delta = git('diff','--no-renames','--name-status','-z',base,candidate).split(b'\0')[:-1]
          assert len(delta) == 628, 'DELTA_SIZE_MISMATCH'
          pairs = list(zip(delta[::2],delta[1::2]))
          counts = collections.Counter(status.decode() for status, _ in pairs)
          assert counts == {'A':227,'M':87}, 'DELTA_STATUS_MISMATCH'
          groups = collections.Counter(p.decode().split('/')[0] for _,p in pairs)
          assert groups == {'.github':42,'backend':61,'frontend':142,'scripts':51,'docs':10,'dc_release_gate':4,'relay':2,'DigitalCrown.spec':1,'run.py':1}
          print('PHASE2_DELTA_PASS',dict(counts),dict(groups))
          patterns = [re.compile(rb'(?m)^-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----\s*$'),re.compile(rb'gh[pousr]_[A-Za-z0-9]{36,}'),re.compile(rb'AKIA[A-Z0-9]{16}')]
          findings = []
          for _, raw in pairs:
              p = raw.decode()
              name = pathlib.PurePosixPath(p).name.lower()
              if name in ('.env','.env.local','.env.production','.env.production.local','id_rsa','id_ed25519') or name.endswith(('.p12','.pfx','.sqlite','.sqlite3','.db','.dcm')):
                  findings.append((p,'restricted-name'))
              blob=git('show',candidate+':'+p)
              if any(pat.search(blob) for pat in patterns):
                  findings.append((p,'credential-pattern'))
              if p.endswith('.py'):
                  import ast
                  ast.parse(blob.decode('utf-8-sig'),filename=p)
          for p, kind in findings:
              print('REVIEW_REQUIRED',kind,p)
          assert not findings, 'RESTRICTED_CONTENT_PATTERN_REVIEW_REQUIRED'
          print('PHASE2_DELTA_PATTERN_AND_PYTHON_SYNTAX_PASS files=314; bounded signature scan, not a confidentiality certification')
          PY
  authority-regression:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay synthetic authority, recovery and emulator negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm tpm2-tools libtss2-tcti-swtpm0t64
          python -m pip install --disable-pip-version-check --only-binary=:all: 'webauthn==3.0.0' 'cryptography==49.0.0'
          python -m pip check
          python -B -m scripts.ci_j5_02c_passkey_lab
          python -B -m scripts.ci_j5_02c_recovery_lab
          python -B -m scripts.ci_j5_02c_trust_root_lab
          python -B -m scripts.ci_j5_02c_tpm_anchor_lab
  packaging-guard-regression:
    needs: inventory
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Replay admission and isolated native restore without release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'HEAD_MISMATCH' }
          foreach ($module in @('scripts.ci_j5_03c_asset_exclusion_tests','scripts.ci_r02_launcher_admission','scripts.ci_r02_recovery_authority')) {
            python -B -m $module
            if ($LASTEXITCODE -ne 0) { throw ('REGRESSION_FAILED ' + $module) }
          }
          python -m pip --isolated install --only-binary=:all: 'sqlcipher3==0.6.2' 'SQLAlchemy==2.0.28' 'cryptography==49.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'DEPENDENCIES_FAILED' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'PIP_CHECK_FAILED' }
          python -B -m scripts.ci_j5_03d_sqlcipher_restore
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_FAILED' }
  r03-conv03-security-clinical-retention:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact convergence HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate integration driver syntax
        run: node --check frontend/scripts/ci-desktop-integration.mjs
      - name: Validate all Python source syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('backend').rglob('*.py'))
          for p in files:
              ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          print(f'BACKEND_AST_PASS files={len(files)}')
          PY
      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlcipher-dev libmagic1 libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libgl1 libglib2.0-0t64
      - name: Install pinned Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0' 'torchvision==0.25.0' 'torchaudio==2.10.0'
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple -r backend/requirements.txt
          python -m pip check
          echo PYTHON_DEPENDENCIES_PASS
      - name: Create fresh encrypted LAB and run actual FastAPI without external network
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lab=$(mktemp -d "$RUNNER_TEMP/dc-rehearsal.XXXXXXXX")
          ns="dc-rehearsal-$GITHUB_RUN_ID"
          trap 'sudo ip netns del "$ns" 2>/dev/null || true; rm -rf -- "$lab"' EXIT
          sudo ip netns add "$ns"
          sudo ip netns exec "$ns" ip link set lo up
          export DC_LAB_ROOT="$lab"
          export DC_PYTHON="$(command -v python)"
          export DC_CHECKOUT="$GITHUB_WORKSPACE"
          export DC_EVIDENCE="$RUNNER_TEMP/dc-integration-evidence"
          mkdir -p "$DC_EVIDENCE"
          sudo ip netns exec "$ns" runuser -u "$USER" -- env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" DC_LAB_ROOT="$lab" DC_PYTHON="$DC_PYTHON" DC_CHECKOUT="$DC_CHECKOUT" DC_EVIDENCE="$DC_EVIDENCE" bash -s <<'LAB'
          set -euo pipefail
          umask 077
          cd "$DC_CHECKOUT"
          export HOME="$DC_LAB_ROOT/home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_RUNTIME_DIR="$HOME/runtime" XDG_DATA_HOME="$HOME/data"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME" "$DC_LAB_ROOT/rehearsal-media"
          export ENVIRONMENT=e2e_install_rehearsal
          export ALLOWED_ORIGINS=http://127.0.0.1:5173
          export DC_SYNTH_PASSWORD="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export VITE_API_URL=http://127.0.0.1:8008 VITE_ENABLE_HTTPS=false
          export DATABASE_URL="sqlite:///$DC_LAB_ROOT/fresh-rehearsal.db"
          export MEDIA_ROOT="$DC_LAB_ROOT/rehearsal-media"
          export SECRET_KEY="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export CABINET_MASTER_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export SQLCIPHER_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export MOBILE_PAIRING_KEY_HEX="$("$DC_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')"
          export DIGITALCROWN_ISOLATED_RUNTIME=true TELEMETRY_ENABLED=false
          export GOOGLE_CLIENT_ID='' GOOGLE_CLIENT_SECRET='' SMTP_HOST='' PATIENT_COMPANION_RELAY_URL='' PATIENT_COMPANION_RELAY_BOOTSTRAP_SECRET=''
          export DIGITALCROWN_ISOLATION_DB_FINGERPRINT="$("$DC_PYTHON" -c 'import os; from backend.core.runtime_safety import database_target_fingerprint; print(database_target_fingerprint(os.environ["DATABASE_URL"]))')"
          test ! -e "$DC_LAB_ROOT/fresh-rehearsal.db"
          test "$(ip -o link show | wc -l)" -eq 1
          echo LAB_LOOPBACK_ONLY
          "$DC_PYTHON" -m backend.scripts.ci_fresh_backend_rehearsal
          "$DC_PYTHON" -m backend.scripts.ci_fk_runtime_probe
          "$DC_PYTHON" -m backend.scripts.ci_clinical_retention_probe
          "$DC_PYTHON" -m backend.scripts.ci_f04_business_cascade_probe
          "$DC_PYTHON" -m backend.scripts.ci_fk_mutation_inventory
          "$DC_PYTHON" -m backend.scripts.ci_f04_purge_failclosed_probe
          LAB
