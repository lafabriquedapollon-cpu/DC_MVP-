name: J5-02 authority reconciliation inventory (NOT A RELEASE)
on:
  push:
    branches: [ci/j5-02-authority-reconciliation-20261127]
permissions:
  contents: read
jobs:
  read-only-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Inventory exact HEAD and verify fail-closed authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m scripts.ci_j5_02_authority_inventory
