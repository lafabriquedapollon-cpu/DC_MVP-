          pid=$!
          trap 'rc=$?; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; if [ "$rc" -ne 0 ]; then tail -n 60 "$DC_LAB_ROOT/uvicorn.log" | sed -E "s/([[:xdigit:]]{64})/[MASKED]/g"; fi' EXIT
          "$DC_PYTHON" - <<'PY'
          import json, time, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def get(path):
              with opener.open('http://127.0.0.1:8008' + path, timeout=2) as r:
