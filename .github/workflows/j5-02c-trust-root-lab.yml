name: J5-02C.4 synthetic bound approval and anti-rollback LAB
on:
  push:
    branches: [ci/j5-02c-trust-root-lab-20261127]
permissions:
  contents: read
jobs:
  trust-root-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project pins
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'webauthn==3.0.0' 'cryptography==49.0.0'
          python -m pip check
      - name: Exact checkout and isolated delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only 1264f103507ddcc3d442c31e475df11ed00d8203 HEAD | sort | paste -sd ' ' -)" = '.github/workflows/j5-02c-trust-root-lab.yml scripts/ci_j5_02c_trust_root_lab.py'
      - name: Prior lifecycle regression
        run: python -B -m scripts.ci_j5_02c_recovery_lab
      - name: Bound approval and protected anchor threat model
        run: python -B -m scripts.ci_j5_02c_trust_root_lab
