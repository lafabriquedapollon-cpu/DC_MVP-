name: J5-04C targeted native pipe diagnostic
on:
  push:
    branches: [ci/j5-04c-owner-broker-20261127]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: |
          python -m pip install --only-binary=:all: 'pywin32==311' 'webauthn==3.0.0' 'cryptography==49.0.0' 'cbor2==6.3.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m scripts.ci_j5_04c_pipe_diag
